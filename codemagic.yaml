workflows:

  # ─────────────────────────────────────────────────────────────
  # Preview — debug APK, sideload directly to your phone
  # No signing required.
  # ─────────────────────────────────────────────────────────────
  android-preview:
    name: Android Preview (APK)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      vars:
        EXPO_PUBLIC_API_URL: $EXPO_PUBLIC_API_URL
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: $EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY

    scripts:
      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          # Force-install pnpm@10.26.1 — exact match to local version that
          # generated the lockfile; v10 has no ERR_PNPM_IGNORED_BUILDS.
          npm install -g pnpm@10.26.1 --force
          pnpm install --frozen-lockfile

      - name: Expo prebuild
        working_directory: artifacts/referral-robin
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Patch build.gradle packaging
        working_directory: artifacts/referral-robin
        script: |
          python3 -c "
          path = 'android/app/build.gradle'
          c = open(path).read()
          if 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' in c:
              print('Already patched')
          else:
              q = chr(39)
              excl = q + 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' + q
              block = 'android {\n    packaging {\n        resources {\n            excludes += [' + excl + ']\n        }\n    }'
              open(path, 'w').write(c.replace('android {', block, 1))
              print('Patched')
          "

      - name: Build debug APK
        working_directory: artifacts/referral-robin/android
        script: |
          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

    artifacts:
      - artifacts/referral-robin/android/app/build/outputs/apk/**/*.apk

  # ─────────────────────────────────────────────────────────────
  # Production — signed AAB for the Play Store
  # Requires keystore named "referral_robin_keystore" in Codemagic.
  # ─────────────────────────────────────────────────────────────
  android-production:
    name: Android Production (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      android_signing:
        - referral_robin_keystore
      vars:
        EXPO_PUBLIC_API_URL: $EXPO_PUBLIC_API_URL
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: $EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY

    scripts:
      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          npm install -g pnpm@10.26.1 --force
          pnpm install --frozen-lockfile

      - name: Expo prebuild
        working_directory: artifacts/referral-robin
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Patch build.gradle packaging
        working_directory: artifacts/referral-robin
        script: |
          python3 -c "
          path = 'android/app/build.gradle'
          c = open(path).read()
          if 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' in c:
              print('Already patched')
          else:
              q = chr(39)
              excl = q + 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' + q
              block = 'android {\n    packaging {\n        resources {\n            excludes += [' + excl + ']\n        }\n    }'
              open(path, 'w').write(c.replace('android {', block, 1))
              print('Patched')
          "

      - name: Build release AAB
        working_directory: artifacts/referral-robin/android
        script: |
          ./gradlew bundleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

    artifacts:
      - artifacts/referral-robin/android/app/build/outputs/bundle/**/*.aab
      - artifacts/referral-robin/android/app/build/outputs/mapping/**/*.txt
